<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stylegram</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23111'/><circle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='2.5'/><circle cx='24' cy='8' r='2' fill='%23ff5a5f'/></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <a href="#/" class="logo">stylegram</a>
    <form id="search" class="search" role="search">
      <input name="q" placeholder="Search brands, items, people" aria-label="Search" />

  <main id="view" aria-live="polite"></main>

  <script src="/app.js" type="module"></script>

</html>
